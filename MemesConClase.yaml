  /friendships:
    get:
      tags: [friendships]
      summary: Listar amistades (con filtros)
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          examples:
            ex1: { value: 1 }
            ex2: { value: 2 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, ACCEPTED, BLOCKED] }
          examples:
            ex1: { value: "PENDING" }
            ex2: { value: "ACCEPTED" }
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date-time }
          examples:
            ex1: { value: "2025-01-01T00:00:00" }
            ex2: { value: "2025-06-01T00:00:00" }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date-time }
          examples:
            ex1: { value: "2025-12-31T23:59:59" }
            ex2: { value: "2025-06-30T23:59:59" }
