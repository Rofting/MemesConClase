        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      tags: [friendships]
      summary: Crear amistad
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendshipInDto' }
            examples:
              ex1: { $ref: '#/components/examples/friendIn1' }
              ex2: { $ref: '#/components/examples/friendIn2' }
      responses:
        '201':
          description: Amistad creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/friendOut1' }
                ex2: { $ref: '#/components/examples/friendOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /friendships/{friendshipId}:
    get:
      tags: [friendships]
      summary: Obtener amistad por ID
      parameters:
        - name: friendshipId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            notFound: { value: 999 }
      responses:
        '200':
          description: Amistad encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/friendOut1' }
                ex2: { $ref: '#/components/examples/friendOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    put:
      tags: [friendships]
      summary: Modificar amistad (reemplazo)
      parameters:
        - name: friendshipId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            other: { value: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendshipInDto' }
            examples:
              ex1: { $ref: '#/components/examples/friendIn1' }
              ex2: { $ref: '#/components/examples/friendIn2' }
      responses:
        '200':
          description: Amistad modificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/friendOut1' }
                ex2: { $ref: '#/components/examples/friendOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    patch:
      tags: [friendships]
      summary: Modificar parcialmente una amistad
      parameters:
        - name: friendshipId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            other: { value: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendshipPatchDto' }
            examples:
              ex1: { $ref: '#/components/examples/friendPatch1' }
              ex2: { $ref: '#/components/examples/friendPatch2' }
      responses:
        '200':
          description: Amistad actualizada parcialmente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendshipOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/friendOut1' }
                ex2: { $ref: '#/components/examples/friendOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    delete:
      tags: [friendships]
      summary: Eliminar amistad
      parameters:
        - name: friendshipId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 2 }
            notFound: { value: 88 }
      responses:
        '204': { description: Eliminada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:

  schemas:

    # ===== USERS =====
    UserInDto:
      type: object
      required: [name, email, password, birthDate, active]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        birthDate: { type: string, format: date }
        avatar: { type: string }
        phone:
          type: string
          pattern: '^[0-9]{9}$'
        active: { type: boolean }
        sex:
          type: string
          enum: [Male, Female, Other]

    UserPatchDto:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        birthDate: { type: string, format: date }
        avatar: { type: string }
        phone:
          type: string
          pattern: '^[0-9]{9}$'
        active: { type: boolean }
        sex:
          type: string
          enum: [Male, Female, Other]

    UserOutDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        birthDate: { type: string, format: date }
        avatar: { type: string }
        phone: { type: string }
        active: { type: boolean }
        dateRecord: { type: string, format: date-time }
        sex: { type: string }
        loginCount: { type: integer }
        reputation: { type: number, format: double }

    # ===== PUBLICATIONS =====
    PublicationInDto:
      type: object
      required: [userId, content, typeContent, privacy, latitude, longitude]
      properties:
        userId: { type: integer, format: int64 }
        content: { type: string, maxLength: 500 }
        imageUrl: { type: string }
        typeContent: { type: string, enum: [TEXT, IMAGE, VIDEO] }
        privacy: { type: string, enum: [PUBLIC, PRIVATE] }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        views: { type: integer }
        featured: { type: boolean }

    PublicationPatchDto:
      type: object
      properties:
        content: { type: string, maxLength: 500 }
        imageUrl: { type: string }
        typeContent: { type: string, enum: [TEXT, IMAGE, VIDEO] }
        privacy: { type: string, enum: [PUBLIC, PRIVATE] }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        views: { type: integer }
        featured: { type: boolean }

    PublicationOutDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        content: { type: string }
        imageUrl: { type: string }
        typeContent: { type: string }
        privacy: { type: string }
        publicationDate: { type: string, format: date-time }
        userName: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        views: { type: integer }
        featured: { type: boolean }

    # ===== COMMENTS =====
    CommentInDto:
      type: object
      required: [userId, publicationId, content]
      properties:
        userId: { type: integer, format: int64 }
        publicationId: { type: integer, format: int64 }
        content: { type: string, maxLength: 500 }

    CommentPatchDto:
      type: object
      properties:
        content: { type: string, maxLength: 500 }

    CommentOutDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userName: { type: string }
        publicationId: { type: integer, format: int64 }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
        updatedAt: { type: string, format: date-time }
        likes: { type: integer }
        sentimentScore: { type: number, format: double }

    # ===== REACTIONS =====
    ReactionInDto:
      type: object
      required: [userId, publicationId, type]
      properties:
        userId: { type: integer, format: int64 }
        publicationId: { type: integer, format: int64 }
        type: { type: string, enum: [LIKE, LOVE, HAHA, WOW, SAD, ANGRY] }

    ReactionPatchDto:
      type: object
      properties:
        type: { type: string, enum: [LIKE, LOVE, HAHA, WOW, SAD, ANGRY] }

    ReactionOutDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userName: { type: string }
        publicationId: { type: integer, format: int64 }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }
        weight: { type: integer }
        confidence: { type: number, format: double }

    # ===== FRIENDSHIPS =====
    FriendshipInDto:
      type: object
      required: [userId, friendId, status]
      properties:
        userId: { type: integer, format: int64 }
        friendId: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, ACCEPTED, BLOCKED] }

    FriendshipPatchDto:
      type: object
      properties:
        status: { type: string, enum: [PENDING, ACCEPTED, BLOCKED] }
        notes: { type: string, maxLength: 255 }
        favorite: { type: boolean }
        closenessScore: { type: integer }

    FriendshipOutDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserOutDto' }
        friend: { $ref: '#/components/schemas/UserOutDto' }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        closenessScore: { type: integer }
        notes: { type: string }
        favorite: { type: boolean }
        updatedAt: { type: string, format: date-time }

    # ===== ERRORES =====
    ErrorMessage:
      type: object
      properties:
        fieldName: { type: string }
        message: { type: string }

    ErrorResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        errorMessages:
          type: array
          items: { $ref: '#/components/schemas/ErrorMessage' }

  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            ex1:
              value:
                code: 400
                message: "Bad Request"
                errorMessages:
                  - { fieldName: "email", message: "El formato es inválido" }
                  - { fieldName: "password", message: "Longitud mínima 6" }
            ex2:
              value:
                code: 400
                message: "Bad Request"
                errorMessages:
                  - { fieldName: "latitude", message: "Debe estar entre -90 y 90" }

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            ex1:
              value: { code: 404, message: "Not Found", errorMessages: [] }
            ex2:
              value:
                code: 404
                message: "Not Found"
                errorMessages:
                  - { fieldName: "id", message: "No existe el recurso con ese ID" }

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            ex1:
              value: { code: 500, message: "Internal Server Error" }
            ex2:
              value:
                code: 500
                message: "Internal Server Error"
                errorMessages:
                  - { fieldName: "traceId", message: "9f2d31a..." }

