openapi: 3.0.3
info:
  title: Memes Con Clase API
  version: 1.2.0
  description: API para gestionar usuarios, publicaciones, comentarios, reacciones y amistades.

tags:
  - name: users
    description: Operaciones con usuarios
  - name: publications
    description: Operaciones con publicaciones
  - name: comments
    description: Operaciones con comentarios
  - name: reactions
    description: Operaciones con reacciones
  - name: friendships
    description: Operaciones con amistades

paths:

  /users:
    get:
      tags: [users]
      summary: Listar usuarios (con filtros)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Busca por nombre o email (LIKE)
          examples:
            ex1: { value: "ali" }
            ex2: { value: "gmail.com" }
        - name: active
          in: query
          required: false
          schema: { type: boolean }
          examples:
            ex1: { value: true }
            ex2: { value: false }
        - name: sex
          in: query
          required: false
          schema: { type: string, enum: [Male, Female, Other] }
          examples:
            ex1: { value: "Female" }
            ex2: { value: "Other" }
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserOutDto' }
              examples:
                emptyList:
                  value: []
                twoUsers:
                  value:
                    - $ref: '#/components/examples/userOut1/value'
                    - $ref: '#/components/examples/userOut2/value'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      tags: [users]
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInDto' }
            examples:
              ex1: { $ref: '#/components/examples/userIn1' }
              ex2: { $ref: '#/components/examples/userIn2' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/userOut1' }
                ex2: { $ref: '#/components/examples/userOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /users/{userId}:
    get:
      tags: [users]
      summary: Obtener usuario por ID
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            notFound: { value: 999 }
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/userOut1' }
                ex2: { $ref: '#/components/examples/userOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    put:
      tags: [users]
      summary: Modificar usuario (reemplazo)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            other: { value: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInDto' }
            examples:
              ex1: { $ref: '#/components/examples/userIn1' }
              ex2: { $ref: '#/components/examples/userIn2' }
      responses:
        '200':
          description: Usuario modificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/userOut1' }
                ex2: { $ref: '#/components/examples/userOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    patch:
      tags: [users]
      summary: Modificar parcialmente un usuario
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 1 }
            other: { value: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatchDto' }
            examples:
              ex1: { $ref: '#/components/examples/userPatch1' }
              ex2: { $ref: '#/components/examples/userPatch2' }
      responses:
        '200':
          description: Usuario actualizado parcialmente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOutDto' }
              examples:
                ex1: { $ref: '#/components/examples/userOut1' }
                ex2: { $ref: '#/components/examples/userOut2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    delete:
      tags: [users]
      summary: Eliminar usuario
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          examples:
            ok: { value: 10 }
            notFound: { value: 77 }
      responses:
        '204': { description: Eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /publications:
