      summary: Listar publicaciones (con filtros)
      parameters:
        - name: typeContent
          in: query
          required: false
          schema: { type: string, enum: [TEXT, IMAGE, VIDEO] }
          examples:
            ex1: { value: "TEXT" }
            ex2: { value: "IMAGE" }
        - name: privacy
          in: query
          required: false
          schema: { type: string, enum: [PUBLIC, PRIVATE] }
          examples:
            ex1: { value: "PUBLIC" }
            ex2: { value: "PRIVATE" }
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          examples:
            ex1: { value: 1 }
            ex2: { value: 5 }
      responses:
        '200':
          description: Lista de publicaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicationOutDto' }
