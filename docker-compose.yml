services:
  db:
    image: mariadb:10.11
    container_name: memes-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=memesdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-padmin"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mariadb-data:/var/lib/mysql

  app:
    build: .
    container_name: memes-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/memesdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MariaDBDialect
      # Opcional para evitar fallos de arranque si la BD tarda:
      - SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=0
      - SPRING_SQL_INIT_MODE=never
    ports:
      - "8081:8080"

volumes:
  mariadb-data:
